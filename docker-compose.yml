services:
  astro-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astro-web-container
    # 💡 nginx経由にするため、外向けの「8080:4321」ポート公開は不要になります（コンテナ間通信のみにする）
    expose:
      - "4321"
    restart: always
    environment:
      - HOST=0.0.0.0
      - PORT=4321
    command: npx astro preview --host 0.0.0.0 --port 4321
    networks:
      - web-network

  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy-container
    ports:
      - "8090:80" # 💡 「8085:80」から「8090:80」に変更します
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro # 💡 次で作る設定ファイルをコンテナに読み込ませます
    restart: always
    depends_on:
      - astro-app
    networks:
      - web-network

networks:
  web-network:
    driver: bridge